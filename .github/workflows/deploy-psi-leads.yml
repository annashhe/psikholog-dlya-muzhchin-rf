name: Deploy psi-leads Worker

# Auto-deploy when cloudflare/ changes.
# Repo secret required: CLOUDFLARE_API_TOKEN (Workers Scripts Edit)
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-psi-leads.yml"
  workflow_dispatch:

concurrency:
  group: psi-leads-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CLOUDFLARE_API_TOKEN is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is empty. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          echo "Secret present (length=${#TOKEN})"

      - name: Deploy psi-leads
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f480ee9a20c8270499364bf5fbb05de6
          workingDirectory: cloudflare
          wranglerVersion: "4.119.0"
          command: deploy
