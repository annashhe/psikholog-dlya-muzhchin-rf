<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запись подтверждена | Анна Щеголихина</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/thank-you-page.css" />
    <link rel="stylesheet" href="/assets/blog-cards.css" />
    <link rel="stylesheet" href="/assets/site-chrome.css" />
    <script src="/assets/lead-tracking.js" defer></script>
    <script src="/assets/cookie-notice.js" defer></script>
    <script src="/assets/consent-analytics.js" defer></script>
    <script src="/assets/analytics-events.js" defer></script>
    <script src="/assets/blog-articles-data.js" defer></script>
    <script src="/assets/thank-you-shared.js" defer></script>
    <script src="/assets/site-chrome.js" defer></script>
</head>
<body data-psi-header="minimal">
    <div id="psi-chrome-header"></div>
    <main>
        <div class="container">
            <div class="card" id="thankYouContent">
                <h1>Спасибо!</h1>
                <p class="lead">Запись принята. Загрузка…</p>
            </div>
            <div id="thankYouArticles"></div>
        </div>
    </main>
    <div id="psi-chrome-footer"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var home = window.PSI_SITE_HOME || 'https://психолог-для-мужчин.рф/';
            var messengers = window.thankYouMessengerLinks || '';

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function maskPhone(phone) {
                var digits = String(phone || '').replace(/\D/g, '');
                if (digits.length < 11) return '';
                return '+7 ••• ••• ' + digits.slice(-4, -2) + '-' + digits.slice(-2);
            }

            function resolveTherapy(data) {
                if (typeof window.resolveBookingTherapy === 'function') {
                    return window.resolveBookingTherapy(data);
                }
                return { title: 'Онлайн-консультация', duration: '—', price: '—' };
            }

            function contactViaPhrase(methods) {
                var via = typeof window.formatContactMethodsList === 'function'
                    ? window.formatContactMethodsList(methods)
                    : 'Telegram, WhatsApp или MAX';
                return escapeHtml(via);
            }

            function formatWhen(startIso, endIso, tz) {
                if (!startIso) return '—';
                try {
                    var start = new Date(startIso);
                    var end = endIso ? new Date(endIso) : null;
                    var zone = tz || 'Europe/Kaliningrad';
                    var datePart = start.toLocaleDateString('ru-RU', { timeZone: zone, day: 'numeric', month: 'long', year: 'numeric' });
                    var t0 = start.toLocaleTimeString('ru-RU', { timeZone: zone, hour: '2-digit', minute: '2-digit' });
                    var timePart;
                    if (!end) {
                        timePart = datePart + ', ' + t0;
                    } else {
                        var t1 = end.toLocaleTimeString('ru-RU', { timeZone: zone, hour: '2-digit', minute: '2-digit' });
                        timePart = datePart + ', ' + t0 + ' – ' + t1;
                    }
                    return timePart + ' (' + zone + ')';
                } catch (e) {
                    return startIso;
                }
            }

            function phonePhrase(phone) {
                var masked = maskPhone(phone);
                if (masked) return 'по телефону <strong>' + escapeHtml(masked) + '</strong>';
                return 'по указанному телефону';
            }

            var root = document.getElementById('thankYouContent');
            var articlesEl = document.getElementById('thankYouArticles');
            var raw = null;
            try { raw = sessionStorage.getItem('bookingThankYou'); sessionStorage.removeItem('bookingThankYou'); } catch (e) {}
            if (!raw) {
                root.innerHTML = '<h1>Спасибо!</h1><p class="lead">Если вы только что записались через календарь, заявка принята. Я свяжусь с вами в течение дня тем способом, который вы указали в форме записи.</p><a class="btn" href="' + home + '">На главную</a>';
                if (articlesEl && typeof renderThankYouArticles === 'function') {
                    articlesEl.innerHTML = renderThankYouArticles();
                }
                return;
            }
            var data;
            try { data = JSON.parse(raw); } catch (e) { data = {}; }
            var name = escapeHtml(data.name || 'коллега');
            var therapy = resolveTherapy(data);
            var when = formatWhen(data.startIso, data.endIso, data.clientTimezone);

            root.innerHTML =
                '<h1>Спасибо, ' + name + '!</h1>' +
                '<p class="lead">Я получила вашу заявку на онлайн-консультацию и свяжусь с вами через ' + contactViaPhrase(data.contactMethods) + ' ' + phonePhrase(data.phone) + ' в течение дня, чтобы подтвердить запись.</p>' +
                '<dl class="details">' +
                '<dt>Формат</dt><dd>' + therapy.title + '</dd>' +
                '<dt>Длительность</dt><dd>' + therapy.duration + '</dd>' +
                '<dt>Стоимость</dt><dd>' + therapy.price + '</dd>' +
                '<dt>Способ связи</dt><dd>' + contactViaPhrase(data.contactMethods) + '</dd>' +
                '<dt>Выбранное время</dt><dd>' + escapeHtml(when) + '</dd>' +
                '</dl>' +
                '<p class="note">Если нужно перенести время — напишите в ' + messengers + '.</p>' +
                '<a class="btn" href="' + home + '">Вернуться на сайт</a>';

            if (articlesEl && typeof renderThankYouArticles === 'function') {
                articlesEl.innerHTML = renderThankYouArticles();
            }
        });
    </script>
</body>
</html>
